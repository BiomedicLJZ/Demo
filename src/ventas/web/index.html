<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asistente de ventas</title>
<style>
  :root {
    --bg:#eef1f5; --card:#fff; --fg:#1c2330; --dim:#6b7686; --line:#e3e7ee;
    --accent:#4f46e5; --accent2:#7c3aed; --bot:#f1f3f9; --user-fg:#fff; --shadow:0 10px 40px rgba(30,40,80,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1117; --card:#171b24; --fg:#e8ebf2; --dim:#8c97a9; --line:#262c38; --bot:#222836; --shadow:0 10px 40px rgba(0,0,0,.5); }
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100dvh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
  .app { position:relative; width:min(760px,100%); height:min(860px,100dvh); display:flex; flex-direction:column;
         background:var(--card); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; }
  @media (max-width:760px) { .app { border-radius:0; height:100dvh; } }

  header { display:flex; align-items:center; gap:12px; padding:14px 18px; color:#fff;
           background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .logo { width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.2); display:grid; place-items:center; font-size:20px; }
  header h1 { font-size:16px; margin:0; line-height:1.2; }
  header p { margin:0; font-size:12px; opacity:.85; }
  header .estado { display:inline-block; width:8px; height:8px; border-radius:50%; background:#4ade80; margin-right:5px; }
  header .espacio { flex:1; }
  #nuevo { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }
  #nuevo:hover, #salir:hover { background:rgba(255,255,255,.3); }
  #salir { background:rgba(255,255,255,.18); color:#fff; border:0; border-radius:8px; padding:6px 12px; font:inherit; font-size:13px; cursor:pointer; }

  #acceso { position:absolute; inset:0; z-index:2; display:grid; place-items:center; padding:20px; background:var(--card); }
  #acceso[hidden] { display:none; }
  #acceso form { display:flex; flex-direction:column; align-items:stretch; gap:12px; width:min(340px,100%); padding:0; border:0; }
  #acceso h2 { margin:0; font-size:20px; text-align:center; }
  #acceso p { margin:0; color:var(--dim); font-size:13px; text-align:center; }
  #acceso input { font:inherit; color:var(--fg); background:var(--bot); border:1px solid transparent; border-radius:12px; padding:11px 14px; outline:0; }
  #acceso input:focus { border-color:var(--accent); }
  #acceso button { border:0; border-radius:12px; padding:11px; font:inherit; font-weight:600; color:#fff; cursor:pointer;
                   background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  #acceso button:disabled { opacity:.45; cursor:default; }
  #acceso .err { color:#b3261e; min-height:1.4em; }

  #log { flex:1; overflow-y:auto; padding:20px 18px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; }
  .fila { display:flex; gap:8px; align-items:flex-end; animation:entra .2s ease-out; }
  .fila.user { justify-content:flex-end; }
  .avatar { width:28px; height:28px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:14px;
            background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  .burbuja { max-width:82%; padding:9px 14px; border-radius:18px; overflow-wrap:anywhere; background:var(--bot); }
  .burbuja p { margin:0; } .burbuja p + p, .burbuja p + ul, .burbuja p + ol, .burbuja ul + p, .burbuja ol + p { margin-top:6px; }
  .burbuja ul, .burbuja ol { margin:0; padding-left:20px; }
  .fila.bot .burbuja { border-bottom-left-radius:6px; }
  .fila.user .burbuja { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:var(--user-fg); border-bottom-right-radius:6px; }
  .fila.error .burbuja { background:#fdecea; color:#b3261e; }
  .puntos { display:flex; gap:4px; padding:4px 0; }
  .puntos i { width:7px; height:7px; border-radius:50%; background:var(--dim); animation:salta 1.2s infinite; }
  .puntos i:nth-child(2) { animation-delay:.15s; } .puntos i:nth-child(3) { animation-delay:.3s; }
  @keyframes salta { 0%,60%,100% { transform:translateY(0); opacity:.5 } 30% { transform:translateY(-5px); opacity:1 } }
  @keyframes entra { from { opacity:0; transform:translateY(6px) } to { opacity:1; transform:none } }

  .dev { font:12px/1.4 ui-monospace,monospace; color:var(--dim); margin-left:36px; }
  .dev pre { margin:2px 0 0; padding:6px 8px; max-height:110px; overflow:auto; white-space:pre-wrap; border-left:2px solid var(--line); }

  #sugerencias { display:flex; flex-wrap:wrap; gap:8px; padding:0 18px 10px; }
  #sugerencias button { border:1px solid var(--line); background:var(--card); color:var(--accent); border-radius:999px;
                        padding:7px 14px; font:inherit; font-size:13px; cursor:pointer; transition:.15s; }
  #sugerencias button:hover { background:var(--accent); color:#fff; border-color:var(--accent); }

  form { display:flex; gap:10px; align-items:flex-end; padding:12px 16px 16px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; max-height:120px; font:inherit; color:var(--fg); background:var(--bot);
             border:1px solid transparent; border-radius:22px; padding:10px 16px; outline:0; }
  textarea:focus { border-color:var(--accent); }
  #enviar { width:42px; height:42px; border-radius:50%; border:0; cursor:pointer; color:#fff; font-size:18px;
            background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  #enviar:disabled { opacity:.45; cursor:default; }
  .pie { text-align:center; font-size:11px; color:var(--dim); padding:0 0 10px; }
  .pie:empty { display:none; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">🛒</div>
    <div>
      <h1>Asistente de ventas</h1>
      <p><span class="estado"></span>En línea · <span id="empresa"></span></p>
    </div>
    <span class="espacio"></span>
    <button id="nuevo" type="button">Nueva conversación</button>
    <button id="salir" type="button">Salir</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <div id="sugerencias"></div>
  <form id="form">
    <textarea id="txt" rows="1" placeholder="Escribe tu mensaje…" autofocus></textarea>
    <button id="enviar" aria-label="Enviar">➤</button>
  </form>
  <div class="pie" id="pie"></div>
  <div id="acceso" hidden>
    <form id="formAcceso">
      <h2>🛒 Asistente de ventas</h2>
      <p>Inicia sesión para atender a tu empresa.</p>
      <input id="usuario" autocomplete="username" placeholder="Usuario" required>
      <input id="clave" type="password" autocomplete="current-password" placeholder="Contraseña" required>
      <div class="err" id="errAcceso" role="alert"></div>
      <button id="entrar">Entrar</button>
    </form>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log"), txt = $("txt");
const dev = new URLSearchParams(location.search).has("dev"); // ?dev muestra herramientas y proveedor
let perfil = null; // {usuario, empresa, sugerencias} de la sesión; null = sin sesión
const bienvenida = () => `¡Hola! 👋 Soy el asistente de ${perfil.empresa}. Puedo ayudarte a encontrar productos, armar tu pedido y completar el pago. ¿Qué estás buscando?`;
let threadId = null, ocupado = false, escribiendo = null;
if (dev) $("pie").textContent = "Modo desarrollo: se muestran herramientas y proveedor";

// Markdown mínimo (negritas, listas) construido con nodos DOM: nunca se inyecta HTML del modelo.
function enLinea(padre, s) {
  for (const p of s.split(/(\*\*[^*]+\*\*)/)) {
    if (/^\*\*[^*]+\*\*$/.test(p)) { const b = document.createElement("strong"); b.textContent = p.slice(2, -2); padre.append(b); }
    else if (p) padre.append(p);
  }
}
function render(el, texto) {
  el.replaceChildren();
  let lista = null;
  for (const linea of texto.split("\n")) {
    const m = /^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(linea);
    if (m) {
      lista ??= el.appendChild(document.createElement(/^\s*\d/.test(linea) ? "ol" : "ul"));
      enLinea(lista.appendChild(document.createElement("li")), m[1]);
    } else {
      lista = null;
      if (linea.trim()) enLinea(el.appendChild(document.createElement("p")), linea);
    }
  }
}

function agregar(nodoNuevo) {
  escribiendo ? log.insertBefore(nodoNuevo, escribiendo) : log.append(nodoNuevo);
  log.scrollTop = log.scrollHeight;
  return nodoNuevo;
}
function fila(clase, texto = "") {
  const f = document.createElement("div"); f.className = `fila ${clase}`;
  if (clase !== "user") { const a = document.createElement("div"); a.className = "avatar"; a.textContent = "🤖"; f.append(a); }
  const b = document.createElement("div"); b.className = "burbuja";
  if (texto) render(b, texto);
  f.append(b); agregar(f);
  return b;
}
function indicador() {
  const f = document.createElement("div"); f.className = "fila bot";
  f.innerHTML = '<div class="avatar">🤖</div><div class="burbuja"><div class="puntos"><i></i><i></i><i></i></div></div>';
  log.append(f); log.scrollTop = log.scrollHeight;
  return f;
}
function lineaDev(texto, pre) {
  const d = document.createElement("div"); d.className = "dev"; d.textContent = texto;
  if (pre) { const p = document.createElement("pre"); p.textContent = pre; d.textContent = ""; d.append(p); }
  agregar(d);
}

// Parsea el stream SSE de POST /api/chat (EventSource solo soporta GET).
async function* eventos(resp) {
  const rd = resp.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "";
  for (;;) {
    const { value, done } = await rd.read();
    if (done) return;
    buf += value;
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const bloque = buf.slice(0, i); buf = buf.slice(i + 2);
      const ev = /^event: (.*)$/m.exec(bloque)?.[1], dato = /^data: (.*)$/m.exec(bloque)?.[1];
      if (ev && dato) yield [ev, JSON.parse(dato)];
    }
  }
}

async function enviar(mensaje) {
  ocupado = true; $("enviar").disabled = true; $("sugerencias").replaceChildren();
  fila("user", mensaje);
  escribiendo = indicador();
  let burbuja = null, acumulado = "";
  const quitarIndicador = () => { escribiendo?.remove(); escribiendo = null; };
  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mensaje, thread_id: threadId }),
    });
    if (resp.status === 401) { quitarIndicador(); mostrarAcceso("Tu sesión expiró. Vuelve a entrar."); return; }
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    for await (const [ev, d] of eventos(resp)) {
      if (ev === "token") {
        if (!burbuja) { quitarIndicador(); burbuja = fila("bot"); acumulado = ""; }
        acumulado += d.texto; render(burbuja, acumulado); log.scrollTop = log.scrollHeight;
      } else if (ev === "herramienta") {
        burbuja = null; if (dev) lineaDev(`🔧 ${d.nombre}(${JSON.stringify(d.args)})`);
      } else if (ev === "resultado") {
        if (dev) lineaDev("", d.texto);
      } else if (ev === "error") {
        quitarIndicador(); console.error(d.mensaje);
        fila("bot error", dev ? d.mensaje : "Lo siento, tuve un problema para responder. ¿Puedes intentarlo de nuevo?");
      } else if (ev === "fin") {
        threadId = d.thread_id; if (dev) $("pie").textContent = `Respondió: ${d.proveedor}`;
      }
    }
  } catch (e) {
    quitarIndicador(); console.error(e);
    fila("bot error", "No pude conectarme con el servidor. Inténtalo de nuevo en un momento.");
  } finally {
    quitarIndicador(); ocupado = false; $("enviar").disabled = false; txt.focus();
  }
}

function mostrarAcceso(mensaje = "") {
  perfil = null; threadId = null; log.replaceChildren(); $("sugerencias").replaceChildren();
  $("empresa").textContent = ""; $("errAcceso").textContent = mensaje; $("clave").value = "";
  $("acceso").hidden = false; $("usuario").focus();
}
function entrar(p) {
  perfil = p; $("acceso").hidden = true; $("empresa").textContent = p.empresa; inicio();
}

function inicio() {
  threadId = null; log.replaceChildren(); fila("bot", bienvenida());
  const s = $("sugerencias"); s.replaceChildren();
  for (const t of perfil.sugerencias) {
    const b = document.createElement("button"); b.type = "button"; b.textContent = t;
    b.onclick = () => !ocupado && enviar(t); s.append(b);
  }
  txt.focus();
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const m = txt.value.trim();
  if (!m || ocupado) return;
  txt.value = ""; txt.style.height = ""; enviar(m);
});
txt.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
txt.addEventListener("input", () => { txt.style.height = "auto"; txt.style.height = txt.scrollHeight + "px"; });
$("nuevo").onclick = () => !ocupado && perfil && inicio();
$("salir").onclick = async () => { await fetch("/api/logout", { method: "POST" }); mostrarAcceso(); };
$("formAcceso").addEventListener("submit", async (e) => {
  e.preventDefault(); $("entrar").disabled = true; $("errAcceso").textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify({ usuario: $("usuario").value, clave: $("clave").value }) });
    if (r.ok) entrar(await r.json());
    else $("errAcceso").textContent = (await r.json().catch(() => ({}))).detail ?? `Error ${r.status}`;
  } catch { $("errAcceso").textContent = "No pude conectarme con el servidor."; }
  finally { $("entrar").disabled = false; }
});
fetch("/api/yo").then(async (r) => (r.ok ? entrar(await r.json()) : mostrarAcceso()))
  .catch(() => mostrarAcceso("No pude conectarme con el servidor."));
</script>
</body>
</html>
